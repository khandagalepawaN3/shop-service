<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
        <div class="container mt-5">
            <h2>All Orders</h2>
            <table class="table table-bordered">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer Name</th>
                    <th>Mobile Number</th>
                    <th>Items</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                    <th>Order Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">

                        <td th:text="${order.id}"></td>

                        <td th:text="${order.customerName}"></td>

                        <td th:text="${order.mobileNumber}"></td>

                        <td>

                            <div th:each="item : ${order.items}">

                                <span
                                    th:text="${item.productName}">
                                </span>

                                x

                                <span
                                     th:text="${item.quantity}">
                                    </span>

                                <br>

                            </div>

                        </td>

                        <td th:text="${order.totalAmount}"></td>

                        <td th:text="${order.status}"></td>

                        <td>

                            <a th:href=
                               "@{/admin/orders/status/{id}/{status}
                                (id=${order.id},status='PREPARING')}"
                               class="btn btn-warning btn-sm">

                                Preparing

                            </a>

                            <a th:href=
                                "@{/admin/orders/status/{id}/{status}
                                (id=${order.id},status='READY')}"
                               class="btn btn-info btn-sm">

                                Ready

                            </a>

                            <a th:href=
                               "@{/admin/orders/status/{id}/{status}
                               (id=${order.id},status='COMPLETED')}"
                               class="btn btn-success btn-sm">

                                Complete

                            </a>
                        </td>

                        <td th:text="${order.orderDate}"></td>

                </tr>
                </tbody>
            </table>
        </div>
</body>
</html>
