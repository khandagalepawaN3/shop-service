<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="row mb-4">

    <div class="col-md-3">

        <div class="card text-center">

            <div class="card-body">

                <h5>Total Products</h5>

                <h2 th:text="${totalProducts}">
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center">

            <div class="card-body">

                <h5>Total Orders</h5>

                <h2 th:text="${totalOrders}">
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center">

            <div class="card-body">

                <h5>Pending</h5>

                <h2 th:text="${pendingOrders}">
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center">

            <div class="card-body">

                <h5>Completed</h5>

                <h2 th:text="${completedOrders}">
                </h2>

            </div>

        </div>

    </div>

</div>
<hr>

<h2>All Products</h2>
<table class="table">

    <thead>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="product : ${products}">

        <td th:text="${product.name}"></td>

        <td th:text="${product.price}"></td>

        <td>

            <a th:href="@{/admin/edit/{id}(id=${product.id})}"
               class="btn btn-warning btn-sm">
                Edit
            </a>

            <a th:href="@{/admin/delete/{id}(id=${product.id})}"
               class="btn btn-danger btn-sm">

                Delete

            </a>

        </td>

    </tr>

    </tbody>

</table>
        <div class="container mt-5">

            <h2>Add Product</h2>

            <form th:action="@{/admin/save}"
                  th:object="${product}"
                  method="post"
                enctype="multipart/form-data">

                <input type="hidden"
                       th:field = "*{id}">

                <input type="text"
                       th:field="*{name}"
                       placeholder="Product Name"
                       class="form-control mb-3">

                <div class="text-danger"
                     th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">
                </div>

                <input type="text"
                       th:field="*{description}"
                       placeholder="Description"
                       class="form-control mb-3">
                <div class="text-danger"
                     th:if="${#fields.hasErrors('description')}"
                     th:errors="*{description}">
                </div>

                <input type="text"
                       step="0.01"
                       th:field="*{price}"
                       placeholder="Price"
                       class="form-control mb-3">
                <div class="text-danger"
                     th:if="${#fields.hasErrors('price')}"
                     th:errors="*{price}">
                </div>

                <input type="file"
                       name="imageFile"
                       class="form-control mb-3">

                <button class="btn btn-primary">
                    Save Product
                    </button>

            </form>
            <a th:href="@{/admin/orders}"
               class="btn btn-warning">
                View Orders
            </a>

        </div>
</body>
</html>
