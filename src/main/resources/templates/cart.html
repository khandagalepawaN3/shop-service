<!DOCTYPE html>
<html lang="en">
<head>


    <meta charset="UTF-8">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Your Cart</h2>

    <table class="table">

        <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="item : ${cart}">

            <td th:text="${item.productName}"></td>

            <td th:text="${item.price}"></td>


            <td>

                <a th:href="@{/cart/decrease/{id}(id=${item.productId})}"
               class="btn btn-warning btn-sm">

                -

                </a>
                    <span class="mx-2"
                            th:text="${item.quantity}">
                    </span>

                <a th:href="@{/cart/increase/{id}(id=${item.productId})}"
               class="btn btn-warning btn-sm">
                +
                </a>

            </td>

            <td>
                <a th:href="@{/cart/remove/{id}(id=${item.productId})}"
                   class="btn btn-danger btn-sm">

                    Remove

                </a>
            </td>
        </tr>

        </tbody>

    </table>

    <h4>
        Total Amount:
        ₹ <span th:text = "${total}"></span>
    </h4>

    <hr>
    <h3>Place Order</h3>

    <form th:action="@{/order/place}" method="post">

        <input type="text"
               name="customerName"
               class="form-control mb-2"
               placeholder="Your Name">

        <input type="text"
               name="mobileNumber"
               class="form-control mb-2"
               placeholder="Mobile Number">

        <button class="btn btn-success">
            Place Order
        </button>

    </form>
</div>

</body>
</html>
