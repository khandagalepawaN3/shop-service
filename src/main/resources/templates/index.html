<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="row">

        <div class="col-md-4"
             th:each="product : ${products}">

            <div class="card mt-3">

                <img th:src="@{/images/{img}(img=${product.imageUrl})}"
                     class="card-img-top">

                <div class="card-body">

                    <h5 th:text="${product.name}"></h5>

                    <p th:text="${product.description}"></p>

                    <h4>
                        ₹ <span th:text="${product.price}"></span>
                    </h4>

                    <a th:href="@{/cart/add/{id}(id=${product.id})}"
                       class="btn btn-success">

                        Add to cart

                    </a>

                </div>
            </div>
        </div>

    </div>
</div>
<div class="mt-3">
    <a href="/cart"
       class="btn btn-dark">
        View cart
    </a>
</div>

</body>
</html>
